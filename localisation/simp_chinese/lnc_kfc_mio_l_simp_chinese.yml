 mcdonalds_and_kfc_mio_desc:"据野史记载，创始人是OO，牢头与归零。OO在xxxx年xx月xx日向某个钢四群的财政部提交了一份关于在群内成立量产M与K生产公司的建议书，并在第二日经由卡比授权、lnc批准建立上述生产公司。原K与M量产厂于之后几日经由OO不断建成投产，初期主要为K与M提供制作汉堡与炸鸡的原材料。几年之后，工厂开始为钢四中正式生产K的炸鸡与M的麦辣鸡腿堡。xxxx年，经由群内第三套领导班子决定，与研究军需品研究院合并，成立研究军需品与量产K和M生产商。合并之后，该工厂一跃成为群内MIO的杰出代表。在接下来的钢四二战中，由该MIO所生产的大量M汉堡与K炸鸡帮助群内成员打赢多次天堂之战。"
